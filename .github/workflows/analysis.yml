name: analysis
on:
  push:
    branches: ['arena/01a0c3f7-arena']
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: fetch data
        continue-on-error: true
        env:
          DEADLINE_SECONDS: '1200'
        run: python3 _analysis/fetch2.py 2>&1 | tail -100
      - name: index
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, glob
          for p in sorted(glob.glob('_analysis/raw*/*.json')):
              try:
                  d = json.load(open(p))
                  n = d.get('count') if isinstance(d, dict) else 1
              except Exception:
                  n = -1
              print('%-62s %9d bytes n=%s' % (p, os.path.getsize(p), n))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-data
          path: |
            _analysis/raw
            _analysis/raw2
          retention-days: 7
          if-no-files-found: warn
