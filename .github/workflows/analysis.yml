name: analysis
on:
  push:
    branches: ['arena/01a0c3f7-arena']
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: fetch data
        run: python3 _analysis/fetch.py 2>&1 | tail -80
      - name: index
        run: |
          python3 - <<'PY'
          import json, os, glob
          rows = []
          for p in sorted(glob.glob('_analysis/raw/*.json')):
              try:
                  d = json.load(open(p))
                  n = d.get('count') if isinstance(d, dict) else 1
              except Exception:
                  n = -1
              rows.append((os.path.basename(p), os.path.getsize(p), n))
          for r in rows:
              print('%-60s %9d bytes n=%s' % r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: _analysis/raw
          retention-days: 7
